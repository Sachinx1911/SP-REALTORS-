# SP REALTORS — local development environment ONLY.
# हे फक्त development साठी आहे. Live server वर upload करताना ही file पाठवायची नाही.
# फक्त sp-realtors-core/, sp-realtors/, sp-realtors-child/ folders live site वर जातात.
#
# सुरू करणे : docker compose up -d
# WordPress : http://localhost:8080
# Mailpit   : http://localhost:8025   (contact form चे mail इथे दिसतील)
# phpMyAdmin: http://localhost:8081

services:
  db:
    image: mysql:8.0
    container_name: spr_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-wordpress}"
      MYSQL_USER: "${MYSQL_USER:-wp}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-wp}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    container_name: spr_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE:-wordpress}"
      WORDPRESS_DB_USER: "${MYSQL_USER:-wp}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD:-wp}"
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        /* Mail: docker/mu-plugins/spr-dev-mailpit.php सगळे mail Mailpit कडे पाठवते */
    volumes:
      - wp_core:/var/www/html
      # आपले plugin + theme थेट mount — code बदलले की लगेच दिसते.
      - ./sp-realtors-core:/var/www/html/wp-content/plugins/sp-realtors-core
      - ./sp-realtors:/var/www/html/wp-content/themes/sp-realtors
      - ./sp-realtors-child:/var/www/html/wp-content/themes/sp-realtors-child
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins

  wpcli:
    image: wordpress:cli-php8.2
    container_name: spr_cli
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE:-wordpress}"
      WORDPRESS_DB_USER: "${MYSQL_USER:-wp}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD:-wp}"
    volumes:
      - wp_core:/var/www/html
      - ./sp-realtors-core:/var/www/html/wp-content/plugins/sp-realtors-core
      - ./sp-realtors:/var/www/html/wp-content/themes/sp-realtors
      - ./sp-realtors-child:/var/www/html/wp-content/themes/sp-realtors-child
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./docker/tests:/tests:ro   # wp eval-file /tests/xyz.php
    entrypoint: ["tail", "-f", "/dev/null"]  # चालू ठेवते; commands `docker compose exec wpcli wp ...` ने चालवा

  mailpit:
    image: axllent/mailpit:latest
    container_name: spr_mail
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: spr_pma
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M

volumes:
  db_data:
  wp_core:
